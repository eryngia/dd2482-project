name: Deploy

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: "Image to deploy, e.g. ghcr.io/<owner>/<repo>:1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VM
    runs-on: self-hosted
    environment: local-vm
    concurrency:
      group: deploy-local-vm
      cancel-in-progress: false
    env:
      TF_VAR_image: ${{ inputs.image }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Terraform init
        run: terraform init -input=false -backend-config="path=$HOME/.tfstate/project-vm.tfstate"

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

      - name: Verify deployment
        run: |
          multipass exec project-vm -- cloud-init status --wait
          multipass exec project-vm -- curl --fail --silent --show-error --retry 30 --retry-delay 5 --retry-all-errors http://localhost:8080/actuator/health