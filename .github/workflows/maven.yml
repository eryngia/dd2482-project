name: build and scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read 

jobs:
  build-and-scan:
    runs-on: ubuntu-latest 

    steps:
    - uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin
        cache: maven

    - name: Build with Maven
      run: mvn -B verify --file pom.xml

    - name: Trivy security scan 
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'vuln,secret'
        severity: 'HIGH,CRITICAL'
        exit-code: '1' 

    - name: Generate SBOM
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'cyclonedx'
        output: 'sbom.json'
        scanners: 'vuln'

    - name: Upload SBOM
      uses: actions/upload-artifact@v5
      with:
        name: sbom
        path: sbom.json

    - name: Build Docker image 
      run: docker build -t spring-boot-crud-rest .

    - name: Trivy Docker image scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'spring-boot-crud-rest'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        exit-code: '1' 