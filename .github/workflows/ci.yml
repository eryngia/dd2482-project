name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    JAVA_VERSION: '17'
    IMAGE: app:ci

jobs:
  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
 
      - name: Run Checkstyle
        run: mvn -B -ntp checkstyle:check

  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp verify -Dcheckstyle.skip=true

      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
 
      - name: Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  image:
    name: Build, test & scan image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
 
      - name: Download application jar
        uses: actions/download-artifact@v6
        with:
          name: app-jar
          path: target

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Smoke test
        run: |
          docker run -d --name app --health-interval=3s "$IMAGE"
          for i in $(seq 1 40); do
            health=$(docker inspect -f '{{.State.Health.Status}}' app)
            running=$(docker inspect -f '{{.State.Running}}' app)
            if [ "$health" = "healthy" ]; then echo "Smoke test passed"; exit 0; fi
            if [ "$running" = "false" ]; then break; fi
            sleep 3
          done
          echo "Smoke test failed"
          exit 1
 
      - name: Container logs
        if: failure()
        run: docker logs app || true


